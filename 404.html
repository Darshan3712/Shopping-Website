<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>ShopVista</title>
    <script>
        // Single Page App GitHub Pages redirect
        // Converts the path into a query parameter so index.html can handle it
        var pathSegmentsToKeep = 1; // keep /Shopping-Website/ prefix
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>

<body></body>

</html>
